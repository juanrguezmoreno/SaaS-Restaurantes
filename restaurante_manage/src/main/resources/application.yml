spring:
  application:
    name: restaurant-manage

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/restaurant_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  sql:
    init:
      mode: always
      defer-datasource-initialization: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: America/Mexico_City

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:MySuperSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLongForHS256Algorithm!!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
    operations-sorter: method
