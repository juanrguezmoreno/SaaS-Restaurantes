spring:
  application:
    name: restaurant-manage

  config:
    # Carga el .env local (gitignorado) para desarrollo; en producción no existe
    # y se ignora (optional). Las variables de entorno reales tienen precedencia.
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/restaurant_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # El esquema lo gestiona Flyway; Hibernate solo valida que coincida con las entidades.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Railway/prod: si la BD ya tiene tablas (creadas antes por ddl-auto) pero no
    # historial de Flyway, se marca como baseline V1 y se aplican V2, V3... en vez
    # de fallar. En una BD vacía Flyway aplica todo desde V1 con normalidad.
    baseline-on-migrate: true
    baseline-version: 1

  # Deshabilitado: los datos de referencia (roles) los siembra Flyway (V2);
  # los datos de demostración solo se cargan en el perfil dev.
  sql:
    init:
      mode: never

  jackson:
    serialization:
      write-dates-as-timestamps: false
    # Solo afecta a tipos con zona horaria (Date/Instant); los java.time
    # (LocalDate/LocalDateTime) se serializan en ISO-8601 tal cual.
    time-zone: Europe/Madrid

server:
  port: ${PORT:8080}

app:
  jwt:
    # Sin valor por defecto: la aplicación NO arranca si JWT_SECRET no está definido.
    # Genera uno con: openssl rand -base64 48
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    # Orígenes permitidos, separados por comas. En producción define
    # CORS_ALLOWED_ORIGINS con el dominio real del frontend.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
    operations-sorter: method
