spring:
  application:
    name: restaurant-manage

  config:
    # Carga el .env local (gitignorado) para desarrollo; en producción no existe
    # y se ignora (optional). Las variables de entorno reales tienen precedencia.
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/restaurant_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # El esquema lo gestiona Flyway; Hibernate solo valida que coincida con las entidades.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Railway/prod: si la BD ya tiene tablas (creadas antes por ddl-auto) pero no
    # historial de Flyway, se marca como baseline V1 y se aplican V2, V3... en vez
    # de fallar. En una BD vacía Flyway aplica todo desde V1 con normalidad.
    baseline-on-migrate: true
    baseline-version: 1

  # Deshabilitado: los datos de referencia (roles) los siembra Flyway (V2);
  # los datos de demostración solo se cargan en el perfil dev.
  sql:
    init:
      mode: never

  jackson:
    serialization:
      write-dates-as-timestamps: false
    # Solo afecta a tipos con zona horaria (Date/Instant); los java.time
    # (LocalDate/LocalDateTime) se serializan en ISO-8601 tal cual.
    time-zone: Europe/Madrid

server:
  port: ${PORT:8080}

app:
  jwt:
    # Sin valor por defecto: la aplicación NO arranca si JWT_SECRET no está definido.
    # Genera uno con: openssl rand -base64 48
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    # Orígenes permitidos, separados por comas. En producción define
    # CORS_ALLOWED_ORIGINS con el dominio real del frontend.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  bootstrap:
    # Bootstrap del primer SUPER_ADMIN en un entorno nuevo (ver SuperAdminBootstrap).
    # Define las tres variables SOLO para el primer arranque; una vez creado el
    # usuario puedes retirarlas. Sin ellas, el bootstrap no hace nada.
    admin-username: ${BOOTSTRAP_ADMIN_USERNAME:}
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    # true: restablece la contraseña de la cuenta de bootstrap existente desde
    # BOOTSTRAP_ADMIN_PASSWORD (recuperación). Retirar tras usar.
    admin-reset-password: ${BOOTSTRAP_ADMIN_RESET_PASSWORD:false}
  maintenance:
    # Frecuencia (ms) del job que corrige mesas RESERVED sin reserva activa.
    # 900000 ms = 15 minutos.
    table-status-fix-delay-ms: ${TABLE_STATUS_FIX_DELAY_MS:900000}
  mail:
    # false (por defecto): el envío se omite (se loguea asunto y destinatario,
    # nunca enlaces ni tokens). Útil en desarrollo/tests sin proveedor real.
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@example.com}
    # API key de Resend (https://resend.com) — envío por API HTTPS, sin SMTP.
    # Nunca la escribas aquí: solo por variable de entorno.
    resend-api-key: ${RESEND_API_KEY:}
  password-reset:
    # Minutos de validez del enlace de recuperación de contraseña.
    token-expiration-minutes: ${PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES:30}
  reservations:
    # Salto entre franjas de la rejilla de reservas, en minutos.
    slot-interval-minutes: ${RESERVATION_SLOT_INTERVAL_MINUTES:30}
    # Minutos que una solicitud pública retiene provisionalmente su mesa. El
    # bloqueo nunca sobrevive a la hora de inicio de la propia reserva.
    hold-expiration-minutes: ${RESERVATION_HOLD_EXPIRATION_MINUTES:720}
    # Horario usado cuando el restaurante no tiene apertura/cierre configurados.
    default-opening-time: "${RESERVATION_DEFAULT_OPENING_TIME:12:00}"
    default-closing-time: "${RESERVATION_DEFAULT_CLOSING_TIME:23:00}"
  frontend:
    # Origen del frontend, usado para construir el enlace de recuperación
    # ({base-url}/reset-password?token=...). En producción define FRONTEND_URL.
    base-url: ${FRONTEND_URL:http://localhost:5173}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
    operations-sorter: method
