spring:
  application:
    name: restaurant-manage

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/restaurant_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # El esquema lo gestiona Flyway; Hibernate solo valida que coincida con las entidades.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Deshabilitado: los datos de referencia (roles) los siembra Flyway (V2);
  # los datos de demostración solo se cargan en el perfil dev.
  sql:
    init:
      mode: never

  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: America/Mexico_City

server:
  port: ${PORT:8080}

app:
  jwt:
    # Sin valor por defecto: la aplicación NO arranca si JWT_SECRET no está definido.
    # Genera uno con: openssl rand -base64 48
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
    operations-sorter: method
