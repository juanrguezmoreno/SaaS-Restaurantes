spring:
  datasource:
    url: jdbc:h2:mem:restaurant_dev
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true

  # Flyway se desactiva en dev: las migraciones son SQL de MySQL y el perfil dev
  # usa H2 con create-drop + data.sql (roles y datos de demostración).
  flyway:
    enabled: false

  sql:
    init:
      mode: always

  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd HH:mm:ss

app:
  jwt:
    secret: DevSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLongForHS256!!
    expiration-ms: 86400000
