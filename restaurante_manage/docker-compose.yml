version: '3.8'

services:
  app:
    build: .
    container_name: restaurant-manage-api
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:mysql://db:3306/restaurant_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - DB_USERNAME=root
      - DB_PASSWORD=root
      # Define JWT_SECRET en tu entorno o en un archivo .env (no committeado)
      - JWT_SECRET=${JWT_SECRET:?Define JWT_SECRET en el entorno o en un archivo .env}
      - JWT_EXPIRATION_MS=86400000
    depends_on:
      - db
    networks:
      - restaurant-network

  db:
    image: mysql:8.0
    container_name: restaurant-mysql
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=restaurant_db
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - restaurant-network

volumes:
  mysql-data:

networks:
  restaurant-network:
    driver: bridge
